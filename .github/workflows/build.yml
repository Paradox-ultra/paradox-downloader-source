name: Build APK
# Builds and signs the release APK. With "publish" ticked, also uploads it to a
# temporary link so the public repo's "Attach release asset" workflow can fetch it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the signed APK to a temporary link for publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.PD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::No signing key secrets: building an unsigned APK"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "PD_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "PD_KEYSTORE_PASSWORD=$KS_PASS"
            echo "PD_KEY_ALIAS=$KEY_ALIAS"
            echo "PD_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Name, verify and hash
        id: apk
        run: |
          set -euo pipefail
          ver=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          code=$(grep -oP "versionCode\s+\K\d+" app/build.gradle)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          echo "### Paradox Downloader v${ver} (versionCode ${code})" >> "$GITHUB_STEP_SUMMARY"
          for src in app/build/outputs/apk/release/*.apk; do
            # app-arm64-v8a-release.apk -> Paradox_Downloader_v4.4_arm64-v8a.apk
            abi=$(basename "$src" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//; s/^release(-unsigned)?$//')
            out="dist/Paradox_Downloader_v${ver}${abi:+_$abi}.apk"
            cp "$src" "$out"
            "$bt/apksigner" verify --print-certs "$out" | tee "$out.signer" || true
            sha=$(sha256sum "$out" | cut -d' ' -f1)
            {
              echo "- \`$(basename "$out")\` · $(stat -c%s "$out") bytes · SHA-256 \`$sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          ( cd dist && sha256sum *.apk | tee SHA256SUMS.txt )
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat dist/*.signer | sort -u >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Optional copy on the run page; skipped when the account's artifact storage is full.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apks
          path: dist/*.apk
          retention-days: 14

      - name: Upload to a temporary link
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            name=$(basename "$apk")
            sha=$(sha256sum "$apk" | cut -d' ' -f1)
            url=$(curl -fsS --retry 3 -F "file=@$apk" https://tmpfiles.org/api/v1/upload | jq -r '.data.url')
            echo "::notice title=Temporary link for $name::$url"
            echo "TMP_URL=$url SHA256=$sha NAME=$name"
            # Secrets mask substrings of the URL in logs; print it base64 too.
            echo "TMP_B64 NAME=$name SHA256=$sha URL_B64=$(printf %s "$url" | base64 -w0)"
            echo "- $name: $url" >> "$GITHUB_STEP_SUMMARY"
          done
