name: Smoke test
# Installs an APK on an emulator, opens it, waits for the background yt-dlp setup,
# and fails if the app crashed. Accepts a release URL or a tmpfiles.org link.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK to test (arm64-v8a)
        required: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get APK
        env:
          U: ${{ inputs.apk_url }}
        run: |
          case "$U" in
            https://tmpfiles.org/dl/*) d="$U" ;;
            https://tmpfiles.org/*) d="https://tmpfiles.org/dl/${U#https://tmpfiles.org/}" ;;
            *) d="$U" ;;
          esac
          curl -fsSL -o app.apk "$d"
          if head -c 512 app.apk | grep -qi '<html'; then
            s=$(grep -oE 'https://tmpfiles\.org/dl/[0-9]+\.[0-9a-f]+/[^"<> ]+' app.apk | head -1)
            curl -fsSL -o app.apk "$s"
          fi
          [ "$(head -c 2 app.apk)" = "PK" ] && ls -la app.apk
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p bot.paradox.downloader.app -c android.intent.category.LAUNCHER 1
            sleep 45
            echo "=== FOCUS ==="; adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
            echo "=== PID ==="; adb shell pidof bot.paradox.downloader.app || true
            echo "=== CRASH ==="; adb logcat -d -b crash || true
            adb logcat -d -b crash | grep -q "bot.paradox.downloader.app" && { echo "::error::app crashed"; exit 1; } || echo "No crash"
