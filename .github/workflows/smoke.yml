name: Smoke test
# Installs a released APK on an emulator, opens it, and prints any crash.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK to test (arm64-v8a)
        required: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get APK
        run: curl -fsSL -o app.apk "${{ inputs.apk_url }}" && ls -la app.apk
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p bot.paradox.downloader.app -c android.intent.category.LAUNCHER 1
            sleep 15
            echo "=== FOCUS ==="; adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
            echo "=== CRASH ==="; adb logcat -d -b crash || true
            echo "=== ERRORS ==="; adb logcat -d '*:E' | grep -iE "paradox|AndroidRuntime|FATAL|Exception|Caused by|at bot\.|at com\.google|at android" | head -150 || true
