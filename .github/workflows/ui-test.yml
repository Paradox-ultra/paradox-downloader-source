name: UI walk-through
# Installs an APK on an emulator and exercises the main screens, settings, themes, a download and
# the browser. Fails with the stack trace on a crash; screenshots are saved as an artifact.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK to test (arm64-v8a build is fine; tmpfiles.org links work)
        required: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get APK
        env:
          U: ${{ inputs.apk_url }}
        run: |
          case "$U" in
            https://tmpfiles.org/dl/*) d="$U" ;;
            https://tmpfiles.org/*) d="https://tmpfiles.org/dl/${U#https://tmpfiles.org/}" ;;
            *) d="$U" ;;
          esac
          curl -fsSL -o app.apk "$d"
          [ "$(head -c 2 app.apk)" = "PK" ] && ls -la app.apk
      - name: Walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ui.sh
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
