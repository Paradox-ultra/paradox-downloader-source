plugins {
    id 'com.android.application'
}

android {
    namespace 'bot.paradox.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'bot.paradox.downloader.app'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '4.3.1'
    }

    // Release signing comes from environment variables set by CI.
    // The keystore itself is never committed.
    def ksPath = System.getenv('PD_KEYSTORE')
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('PD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PD_KEY_ALIAS')
                keyPassword System.getenv('PD_KEY_PASSWORD')
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/*.md', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module',
                         'META-INF/versions/**', '**/*.proto']
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'org.jsoup:jsoup:1.21.1'
}
